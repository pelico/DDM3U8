name: Build & Release Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ddm3u8

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            dockerfile: Dockerfile
          - arch: arm64
            platform: linux/arm64
            dockerfile: Dockerfile
          - arch: armv7l
            platform: linux/arm/v7
            dockerfile: Dockerfile.armv7l
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.ref_name }}
          cache-from: type=gha,scope=main-${{ matrix.arch }}
          cache-to: type=gha,scope=main-${{ matrix.arch }},mode=max

      - name: Build image tar (${{ matrix.arch }})
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --file ${{ matrix.dockerfile }} \
            --tag ${IMAGE_NAME}:${{ matrix.arch }} \
            --output type=docker,dest=${IMAGE_NAME}-${{ matrix.arch }}.tar \
            .

      - name: Show image size
        run: ls -lh ${IMAGE_NAME}-${{ matrix.arch }}.tar

      - name: Upload tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.arch }}
          path: ${{ env.IMAGE_NAME }}-${{ matrix.arch }}.tar
          retention-days: 30

  # 多架构 manifest（latest、v 版本号）：合并三架构成一个 tag，docker pull 自动选架构
  manifest:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker buildx imagetools create -t \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:amd64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:arm64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:armv7l

      - name: Create and push multi-arch manifest (${{ github.ref_name }})
        run: |
          docker buildx imagetools create -t \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:amd64-${{ github.ref_name }} \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:arm64-${{ github.ref_name }} \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:armv7l-${{ github.ref_name }}

  release:
    needs: [build, manifest]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar
