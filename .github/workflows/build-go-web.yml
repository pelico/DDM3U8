name: Build Go Web (uTLS)

on:
  push:
    branches: [go-core]
    paths:
      - 'cmd/ddm3u8-web/**'
      - 'cmd/ddm3u8-go/**'
      - 'internal/**'
      - 'templates/**'
      - 'Dockerfile.web'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-go-web.yml'
    tags: ["go-web-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ddm3u8

jobs:
  # ---------- 多架构 Docker 镜像：Web 版（带前端页面 + API） ----------
  docker-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (web)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=go-web
            type=raw,value=go-web-latest
            type=ref,event=tag
            type=sha,prefix=go-web-sha-

      - name: Build and push (multi-arch, Web 版)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=go-web
          cache-to: type=gha,scope=go-web,mode=max

  # ---------- armv7l 专用标签：避免老 docker 不会按宿主架构自动选 -----------
  docker-web-armv7l:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (armv7l 专用 tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/arm/v7
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web-armv7l
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=go-web
          cache-to: type=gha,scope=go-web,mode=max

  # ---------- 原始静态二进制（CLI 版，armv7l 可直接跑，无需 Docker） ----------
  binaries-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ""
          - arch: arm64
            goarch: arm64
            goarm: ""
          - arch: armv7l
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Cross-compile CLI (${{ matrix.arch }})
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/ddm3u8-go-${{ matrix.arch }} ./cmd/ddm3u8-go
          tar -C out -czf out/ddm3u8-go-${{ matrix.arch }}.tar.gz ddm3u8-go-${{ matrix.arch }}
          ls -lh out/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddm3u8-go-${{ matrix.arch }}
          path: out/ddm3u8-go-${{ matrix.arch }}.tar.gz
          retention-days: 30

  # ---------- 原始静态二进制（Web 版，含 embed 前端，可直接启动服务） ----------
  binaries-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ""
          - arch: arm64
            goarch: arm64
            goarm: ""
          - arch: armv7l
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Cross-compile Web (${{ matrix.arch }})
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/ddm3u8-web-${{ matrix.arch }} ./cmd/ddm3u8-web
          tar -C out -czf out/ddm3u8-web-${{ matrix.arch }}.tar.gz ddm3u8-web-${{ matrix.arch }}
          ls -lh out/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddm3u8-web-${{ matrix.arch }}
          path: out/ddm3u8-web-${{ matrix.arch }}.tar.gz
          retention-days: 30

  # ---------- Release：tag 时把 CLI + Web 二进制都挂上 ----------
  release:
    needs: [binaries-cli, binaries-web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ddm3u8-*-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            artifacts/ddm3u8-go-*.tar.gz
            artifacts/ddm3u8-web-*.tar.gz
          body: |
            Go + uTLS 下载器（${{ github.ref_name }}）

            ## Docker 镜像（Web 版，带前端 + API）

            ```bash
            # amd64 / arm64 机器：直接拉（多架构 manifest 会自动选）
            docker pull ghcr.io/pelico/ddm3u8:go-web

            # armv7l 机器（老 docker 不会自动选架构，用专用 tag）
            docker pull ghcr.io/pelico/ddm3u8:go-web-armv7l

            # 运行（默认起 Web 服务，端口 8080）
            docker run -d \
              --name ddm3u8 \
              -p 8080:8080 \
              -v $PWD/downloads:/downloads \
              -e MAX_DOWNLOADS=3 \
              -e WEB_USER=admin \
              -e WEB_PASS=admin \
              --restart unless-stopped \
              ghcr.io/pelico/ddm3u8:go-web   # armv7l 改成 :go-web-armv7l
            ```

            浏览器访问 `http://server-ip:8080/`，前端页面与原 Flask 版完全一致。

            ## 原始静态二进制（无需 Docker）

            ### Web 版（启动 HTTP 服务 + API + 前端页面）
            ```bash
            tar xzf ddm3u8-web-<arch>.tar.gz
            chmod +x ddm3u8-web-<arch>
            ./ddm3u8-web-<arch> -port 8080 -download-dir /downloads -max-downloads 3
            ```

            ### CLI 版（命令行单任务下载）
            ```bash
            tar xzf ddm3u8-go-<arch>.tar.gz
            chmod +x ddm3u8-go-<arch>
            ./ddm3u8-go-<arch> -url "https://example.com/index.m3u8" \
              -referer "https://example.com" -save-dir . -save-name video
            ```

            合并需要 ffmpeg，armv7l 系统可 `apt install ffmpeg` 或加 `-no-merge` 仅保留分片。
