name: Build Go Web (uTLS)

on:
  push:
    branches: [go-core]
    paths:
      - 'cmd/ddm3u8-web/**'
      - 'cmd/ddm3u8-go/**'
      - 'internal/**'
      - 'templates/**'
      - 'Dockerfile.web'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-go-web.yml'
    tags: ["go-web-v*.*.*"]
  workflow_dispatch:

# 串行化：同时推 go-core + 多个 go-web-v* tag 会触发多个并行 workflow run，
# 它们会互相覆盖共享的 :go-web / :go-web-* 镜像 tag（后跑完的赢，可能把旧代码
# 覆到最新 tag 上）。加 concurrency 让同一时间只有一个 run 在跑，且最新的
# push 会取消仍卡在排队/进行中的旧 run → 共享镜像 tag 最终稳定指向最新代码。
concurrency:
  group: build-go-web
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ddm3u8

jobs:
  # ---------- 单架构专用 tag（三架构各推一个 tag，老 Docker 直接 pull） ----------
  # 不用 docker/build-push-action，直接用 docker buildx build 命令行
  # 这样能用 --build-arg 显式传 TARGET_PLATFORM，绕开 buildx 自动注入的坑
  single-arch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            tag_suffix: amd64
          - arch: arm64
            platform: linux/arm64
            tag_suffix: arm64
          - arch: armv7l
            platform: linux/arm/v7
            tag_suffix: armv7l
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch (${{ matrix.arch }})
        run: |
          docker buildx build \
            --no-cache \
            --platform ${{ matrix.platform }} \
            --file Dockerfile.web \
            --tag ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web-${{ matrix.tag_suffix }} \
            --build-arg TARGET_PLATFORM=${{ matrix.platform }} \
            --build-arg CACHE_BUST=${{ github.sha }} \
            --push \
            .

  # ---------- 把三架构最新镜像聚合成固定的多架构 tag（ghcr.io/..:go-web） ----------
  # 用户日常直接 docker pull ghcr.io/..:go-web，三架构自动识别，始终指向最新。
  # 之前 :go-web 无后缀 tag 从不更新，pull 到的始终是旧版 Web UI。
  # 只在 go-core 分支 push 时合并：tag 触发的 run 只构建后缀镜像/tar/二进制/release，
  # 不碰 :go-web。否则同时推多个 tag 时并行 merge 互相覆盖 :go-web（谁晚跑完谁赢，
  # 可能把旧代码覆到最新 tag）。分支 push 恒指向最新 go-core 代码，确定性最好。
  merge-go-web:
    runs-on: ubuntu-latest
    needs: single-arch
    if: github.ref == 'refs/heads/go-core'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to multi-arch tag :go-web
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web-amd64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web-arm64 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web-armv7l

  # ---------- Docker 镜像 tar 包（三架构，docker load 加载，不依赖 pull 选架构） ----------
  # 只在打 tag（release）时产出：平时用户直接 pull :go-web，无需 tar 包
  tars:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armv7l
            platform: linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image tar (${{ matrix.arch }})
        run: |
          docker buildx build \
            --no-cache \
            --platform ${{ matrix.platform }} \
            --file Dockerfile.web \
            --tag ${{ env.IMAGE_NAME }}:go-web-${{ matrix.arch }} \
            --build-arg TARGET_PLATFORM=${{ matrix.platform }} \
            --build-arg CACHE_BUST=${{ github.sha }} \
            --output type=docker,dest=${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}.tar \
            .

      - name: Show image size
        run: ls -lh ${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}.tar

      - name: Upload tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}
          path: ${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}.tar
          retention-days: 30

  # ---------- 原始静态二进制（CLI 版，armv7l 可直接跑，无需 Docker） ----------
  # 只在打 tag（release）时产出
  binaries-cli:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ""
          - arch: arm64
            goarch: arm64
            goarm: ""
          - arch: armv7l
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build CLI binary (${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/ddm3u8-go ./cmd/ddm3u8-go
          tar -czf ddm3u8-go-${{ matrix.arch }}.tar.gz -C out ddm3u8-go

      - name: Build Web binary (${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/ddm3u8-web ./cmd/ddm3u8-web
          tar -czf ddm3u8-web-${{ matrix.arch }}.tar.gz -C out ddm3u8-web

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: ddm3u8-go-${{ matrix.arch }}
          path: ddm3u8-go-${{ matrix.arch }}.tar.gz
          retention-days: 30

      - name: Upload Web binary
        uses: actions/upload-artifact@v4
        with:
          name: ddm3u8-web-${{ matrix.arch }}
          path: ddm3u8-web-${{ matrix.arch }}.tar.gz
          retention-days: 30

  # ---------- Release（只在 tag 推送时触发） ----------
  release:
    needs: [single-arch, tars, binaries-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ddm3u8-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar
            artifacts/**/*.tar.gz
