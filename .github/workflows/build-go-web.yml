name: Build Go Web (uTLS)

on:
  push:
    branches: [go-core]
    paths:
      - 'cmd/ddm3u8-web/**'
      - 'cmd/ddm3u8-go/**'
      - 'internal/**'
      - 'templates/**'
      - 'Dockerfile.web'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-go-web.yml'
    tags: ["go-web-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ddm3u8

jobs:
  # ---------- 单架构专用 tag（三架构各推一个 tag，老 Docker 直接 pull） ----------
  # 不用 docker/build-push-action，直接用 docker buildx build 命令行
  # 这样能用 --build-arg 显式传 TARGET_PLATFORM，绕开 buildx 自动注入的坑
  single-arch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            tag_suffix: amd64
          - arch: arm64
            platform: linux/arm64
            tag_suffix: arm64
          - arch: armv7l
            platform: linux/arm/v7
            tag_suffix: armv7l
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch (${{ matrix.arch }})
        run: |
          docker buildx build \
            --no-cache \
            --platform ${{ matrix.platform }} \
            --file Dockerfile.web \
            --tag ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web-${{ matrix.tag_suffix }} \
            --tag ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:go-web-${{ matrix.tag_suffix }}-${{ github.ref_name }} \
            --build-arg TARGET_PLATFORM=${{ matrix.platform }} \
            --build-arg CACHE_BUST=${{ github.sha }} \
            --push \
            .

  # ---------- Docker 镜像 tar 包（三架构，docker load 加载，不依赖 pull 选架构） ----------
  tars:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armv7l
            platform: linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image tar (${{ matrix.arch }})
        run: |
          docker buildx build \
            --no-cache \
            --platform ${{ matrix.platform }} \
            --file Dockerfile.web \
            --tag ${{ env.IMAGE_NAME }}:go-web-${{ matrix.arch }} \
            --build-arg TARGET_PLATFORM=${{ matrix.platform }} \
            --build-arg CACHE_BUST=${{ github.sha }} \
            --output type=docker,dest=${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}.tar \
            .

      - name: Show image size
        run: ls -lh ${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}.tar

      - name: Upload tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}
          path: ${{ env.IMAGE_NAME }}-go-web-${{ matrix.arch }}.tar
          retention-days: 30

  # ---------- 原始静态二进制（CLI 版，armv7l 可直接跑，无需 Docker） ----------
  binaries-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ""
          - arch: arm64
            goarch: arm64
            goarm: ""
          - arch: armv7l
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build CLI binary (${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/ddm3u8-go ./cmd/ddm3u8-go
          tar -czf ddm3u8-go-${{ matrix.arch }}.tar.gz -C out ddm3u8-go

      - name: Build Web binary (${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o out/ddm3u8-web ./cmd/ddm3u8-web
          tar -czf ddm3u8-web-${{ matrix.arch }}.tar.gz -C out ddm3u8-web

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: ddm3u8-go-${{ matrix.arch }}
          path: ddm3u8-go-${{ matrix.arch }}.tar.gz
          retention-days: 30

      - name: Upload Web binary
        uses: actions/upload-artifact@v4
        with:
          name: ddm3u8-web-${{ matrix.arch }}
          path: ddm3u8-web-${{ matrix.arch }}.tar.gz
          retention-days: 30

  # ---------- Release（只在 tag 推送时触发） ----------
  release:
    needs: [single-arch, tars, binaries-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ddm3u8-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar
            artifacts/**/*.tar.gz
