<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DDM3U8 下载器</title>
    <style>
        :root {
            --bg-start: #eef2ff;
            --bg-end: #f8fafc;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --surface: rgba(255, 255, 255, 0.92);
            --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
        }
        * { box-sizing: border-box; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            padding: 28px 18px;
            min-height: 100vh;
            color: var(--text);
            margin: 0;
            background:
                radial-gradient(circle at 12% 12%, rgba(79, 70, 229, 0.18), transparent 30%),
                radial-gradient(circle at 88% 8%, rgba(14, 165, 233, 0.16), transparent 28%),
                linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 58%, #ecfeff 100%);
            letter-spacing: -0.01em;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .logo-section { text-align: center; margin-bottom: 28px; }
        .logo-title { font-size: 31px; font-weight: 800; color: #172554; text-shadow: 0 1px 0 rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; gap: 12px; }
        .logo-icon { font-size: 34px; filter: drop-shadow(0 8px 14px rgba(79, 70, 229, 0.25)); }
        .logo-subtitle { margin-top: 8px; font-size: 13px; color: #64748b; }
        .card { background: var(--surface); backdrop-filter: blur(16px); padding: 24px; border-radius: 18px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.72); box-shadow: var(--shadow); transition: transform 0.18s ease, box-shadow 0.18s ease; }
        .card:hover { transform: translateY(-1px); box-shadow: 0 22px 60px rgba(15, 23, 42, 0.13); }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(226,232,240,0.9); }
        h2 { margin: 0 0 16px 0; font-size: 18px; font-weight: 750; color: #0f172a; }
        h3 { margin: 0 0 16px 0; font-size: 16px; font-weight: 720; color: #1e293b; }
        .input-group { display: flex; gap: 12px; margin-bottom: 12px; }
        .input-group input, .input-full {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            outline: none;
            background: rgba(248, 250, 252, 0.92);
            color: var(--text);
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }
        .input-group input { flex: 1; }
        .input-full { margin-bottom: 14px; }
        .input-group input:focus, .input-full:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12); background: #fff; }
        .input-group input::placeholder, .input-full::placeholder { color: #94a3b8; }
        .btn { padding: 11px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }
        .btn-main { background: #4f46e5; color: white; }
        .btn-main:hover { background: #4338ca; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: transparent; color: #64748b; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; color: #334155; }
        .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .table-container { overflow-x: auto; border-radius: 14px; border: 1px solid #edf2f7; background: white; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f8fafc; padding: 13px 12px; font-size: 12px; color: #64748b; font-weight: 750; border-bottom: 1px solid #e2e8f0; }
        td { padding: 14px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; vertical-align: middle; color: #1f2937; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
        .status-action-col { width: 220px; }
        .select-col { width: 42px; }
        .progress-col { width: 280px; }
        .status-action-cell { vertical-align: middle; }
        .status-action-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .checkbox { width: 17px; height: 17px; cursor: pointer; accent-color: var(--primary); transition: transform 0.18s; }
        .checkbox:hover { transform: scale(1.08); }
        .progress-bar { height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 6px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4f46e5 0%, #06b6d4 100%); border-radius: 999px; transition: width 0.3s ease; }
        .progress-text { font-family: "Cascadia Mono", "SF Mono", Consolas, monospace; font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.45; word-break: break-all; }
        .status { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 750; line-height: 1; border: 1px solid transparent; }
        .status-running { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
        .status-pending { background: #fffbeb; color: #b45309; border-color: #fde68a; }
        .status-done { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .status-error { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
        .status-merge { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
        .status-warn { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
        .status-waiting { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
        .empty-state { text-align: center; padding: 44px 20px; color: #94a3b8; }
        .empty-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.55; }
        .batch-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; background: #f8fafc; border-radius: 14px; margin-bottom: 14px; border: 1px solid #e2e8f0; }
        .batch-info { font-size: 13px; color: #475569; display: flex; align-items: center; gap: 16px; }
        .batch-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .tool-card { background: linear-gradient(135deg, rgba(255,251,235,0.96) 0%, rgba(240,253,250,0.94) 100%); border: 1px solid #fde68a; }
        .tool-card h3 { color: #92400e; }
        .tool-card p { font-size: 13px; color: #a16207; }
        .modal { display: none; position: fixed; z-index: 999; inset: 0; background-color: rgba(15, 23, 42, 0.42); backdrop-filter: blur(4px); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 22px; border-radius: 18px; width: 88%; max-width: 470px; max-height: 70vh; overflow-y: auto; box-shadow: 0 24px 70px rgba(15, 23, 42, 0.24); }
        .folder-item { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 13px; border-radius: 10px; color: #334155; }
        .folder-item:hover { background-color: #ecfdf5; color: #047857; }
        .close-btn { color: #94a3b8; float: right; font-size: 22px; font-weight: bold; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: #1f2937; }
        #folderSelectBtn { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 14px; color: #334155; font-size: 13px; width: 100%; cursor: pointer; text-align: left; transition: border-color 0.18s, background 0.18s; }
        #folderSelectBtn:hover { background: #fff; border-color: #94a3b8; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 14px 18px; border-radius: 12px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 40px rgba(15, 23, 42, 0.15); backdrop-filter: blur(12px); animation: toastIn 0.3s ease-out; min-width: 260px; }
        .toast-success { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); color: #047857; border: 1px solid #a7f3d0; }
        .toast-error { background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%); color: #b91c1c; border: 1px solid #fecaca; }
        .toast-info { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); color: #1d4ed8; border: 1px solid #bfdbfe; }
        .toast-warning { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); color: #b45309; border: 1px solid #fde68a; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100px); } }
        .video-file-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.15s; font-size: 13px; color: #334155; }
        .video-file-item:last-child { border-bottom: none; }
        .video-file-item:hover { background: #f0f4ff; }
        .video-file-item.selected { background: #eef2ff; }
        .video-file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .video-file-size { font-size: 11px; color: #94a3b8; white-space: nowrap; font-family: "Cascadia Mono", "SF Mono", Consolas, monospace; }
        .video-file-path { font-size: 11px; color: #a0aec0; }
        @media (max-width: 600px) {
            body { padding: 12px 10px; background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%); }
            .logo-title { font-size: 22px; }
            .logo-subtitle { font-size: 11px; }
            .card { padding: 14px; border-radius: 14px; margin-bottom: 12px; backdrop-filter: none; background: #ffffff; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06); }
            .card-header { flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 8px; gap: 6px; }
            h2 { font-size: 16px; margin-bottom: 8px; }
            h3 { font-size: 15px; margin-bottom: 0; white-space: nowrap; }
            .input-full { padding: 10px 12px; margin-bottom: 10px; }
            .input-group input { padding: 10px 12px; }
            .input-group { margin-bottom: 10px; }
            .btn { padding: 10px 14px; font-size: 13px; }
            .btn-secondary { background: transparent; }
            .input-group { flex-direction: column; }
            thead { display: none; }
            tr { display: block; border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 10px; border-radius: 14px; background: #fafafa; position: relative; }
            td { display: block; border: none; padding: 0; }
            td:nth-child(1) { position: absolute; top: 12px; right: 12px; }
            td:nth-child(2) { font-weight: 700; font-size: 15px; color: #0f172a; padding-right: 28px; margin-bottom: 8px; }
            td:nth-child(3) { margin-bottom: 8px; }
            td:nth-child(3) .status-action-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
            td:nth-child(4) { margin-bottom: 10px; }
            tr::after { content: ""; display: table; clear: both; }
            .select-col { width: auto; }
            .progress-col { width: auto; }
            .status-action-col { width: auto; }
            .batch-bar { flex-direction: column; gap: 8px; padding: 10px 12px; margin-bottom: 10px; }
            .batch-info { font-size: 12px; gap: 12px; }
            .batch-actions { gap: 6px; }
            .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
            .btn-group { gap: 6px; display: inline-flex; }
            .status { padding: 4px 10px; font-size: 12px; }
            .progress-bar { height: 6px; }
            .progress-text { font-size: 11px; margin-top: 5px; line-height: 1.5; }
            .checkbox { width: 16px; height: 16px; }
            .table-container { border-radius: 12px; }
            .tool-card p { font-size: 12px; }
            #folderSelectBtn { padding: 10px 12px; font-size: 13px; }
            .modal { backdrop-filter: none; }
            .toast { backdrop-filter: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-title">
                <span class="logo-icon">📥</span>
                <span>DDM3U8 下载器</span>
            </div>
            <div class="logo-subtitle">轻量任务队列 · 断点恢复 · 本地缓存合并</div>
        </div>
        
        <div class="card">
            <h2>添加下载任务</h2>
            <form id="downForm">
                <textarea class="input-full" name="url" placeholder="粘贴 m3u8 链接，支持多个链接混合输入" required rows="3"></textarea>
                <div class="input-group">
                    <input type="text" name="name" placeholder="视频名称" value="video" required>
                </div>
                <input type="text" class="input-full" name="referer" value="https://" placeholder="选填：全局 Referer">
                <input type="text" class="input-full" name="sub_path" placeholder="选填：下载子目录（如 movie1）不填则存到根目录">
                <button type="submit" class="btn btn-main" style="width: 100%;">开始下载</button>
            </form>
        </div>

        <div class="card tool-card">
            <h3>🛠️ 本地缓存合并工具</h3>
            <form id="localMergeForm">
                <input type="hidden" id="folderInputHidden" name="folder_name" required>
                <button type="button" id="folderSelectBtn" onclick="openFolderModal()">📁 选择包含.ts缓存的文件夹</button>
                <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 10px;">🔍 扫描并合并</button>
            </form>
        </div>

        <div class="card tool-card" style="border-color: #c7d2fe; background: linear-gradient(135deg, rgba(238,242,255,0.96) 0%, rgba(240,253,250,0.94) 100%);">
            <h3 style="color: #3730a3;">🎵 音频提取工具</h3>
            <p style="font-size: 13px; color: #4338ca; margin: 0 0 12px 0;">扫描下载目录中的视频文件，批量提取转换为 m4a 音频</p>
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <button type="button" class="btn btn-main" onclick="loadVideoFiles()" id="scanVideoBtn">📂 扫描视频文件</button>
                <button type="button" class="btn btn-success" onclick="batchAudioExtract()" id="extractAudioBtn" disabled>🎵 提取选中音频</button>
            </div>
            <div id="videoFileList" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="font-size: 13px; color: #475569; display: flex; align-items: center; gap: 6px;">
                        <input type="checkbox" id="selectAllVideos" onchange="toggleSelectAllVideos()" class="checkbox"> 全选
                    </label>
                    <span id="selectedVideoCount" style="font-size: 12px; color: #6b7280;">已选择 0 个</span>
                </div>
                <div id="videoFileContainer" style="max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px; background: white;"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>📋 任务列表</h3>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="workerStatus" style="font-size: 12px; color: #6b7280;">运行中: 0/3</span>
                </div>
            </div>

            <div id="batchBar" class="batch-bar" style="display: none;">
                <div class="batch-info">
                    <label><input type="checkbox" id="selectAll" onchange="toggleSelectAllFromBatch()" class="checkbox"> 全选</label>
                    <span id="selectedCount">已选择 0 个</span>
                </div>
                <div class="batch-actions">
                    <button class="btn btn-sm btn-main" onclick="batchResume()">▶ 恢复选中</button>
                    <button class="btn btn-sm btn-warning" onclick="batchPause()">⏸ 暂停选中</button>
                    <button class="btn btn-sm btn-danger" onclick="batchCancel()">✕ 取消选中</button>
                    <button class="btn btn-sm btn-secondary" onclick="batchClear()">🗑 清理记录</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="select-col"><input type="checkbox" id="headerCheckbox" onchange="toggleSelectAll()" class="checkbox"></th>
                            <th>任务/文件名</th>
                            <th class="status-action-col">状态/操作</th>
                            <th class="progress-col">进度</th>
                        </tr>
                    </thead>
                    <tbody id="taskList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div id="folderModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeFolderModal()">&times;</span>
            <h3 style="margin-top:0; padding-bottom:12px; border-bottom:2px solid #f3f4f6;">📁 选择缓存文件夹</h3>
            <div id="folderList" style="margin-top:12px;">
                <div style="text-align:center; padding:20px; color:#9ca3af;">正在加载...</div>
            </div>
        </div>
    </div>

    <script>
        let selectedTasks = new Set();
        let taskProgressCache = {};
        let refreshInFlight = false;
        let refreshTimer = null;
        let isScrolling = false;
        let scrollTimeout = null;
        let selectedVideoFiles = new Set();
        let videoFilesData = [];
        const ACTIVE_REFRESH_INTERVAL = 2000;
        const IDLE_REFRESH_INTERVAL = 10000;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(ch) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[ch];
            });
        }

        async function apiFetch(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) {
                let message = `请求失败：${response.status}`;
                try {
                    const data = await response.json();
                    message = data.error || message;
                } catch (e) {
                    try {
                        const text = await response.text();
                        if (text) message = text;
                    } catch (_) {}
                }
                throw new Error(message);
            }
            return response;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${icons[type] || icons.info}</span><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function manageTask(taskId, action) {
            try {
                await apiFetch(`/api/task/${encodeURIComponent(taskId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
                refreshTasks(true);
            } catch (err) {
                showToast(err.message || '操作失败', 'error');
            }
        }

        async function clearTasks() {
            try {
                await apiFetch('/api/clear', { method: 'POST' });
                selectedTasks.clear();
                updateSelectedCount();
                refreshTasks(true);
                showToast('已清理任务记录');
            } catch (err) {
                showToast(err.message || '清理失败', 'error');
            }
        }

        async function batchClear() {
            if (selectedTasks.size === 0) return;
            const ids = Array.from(selectedTasks);
            try {
                const response = await apiFetch('/api/clear-selected', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids })
                });
                const data = await response.json();
                showToast(`已清理 ${data.deleted || 0} 条记录`);
            } catch (err) {
                showToast(err.message || '清理选中失败', 'error');
            }
            selectedTasks.clear();
            updateSelectedCount();
            refreshTasks(true);
        }

        document.getElementById('downForm').onsubmit = async function(e) {
            e.preventDefault();
            const button = this.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                const response = await apiFetch('/down', { method: 'POST', body: new URLSearchParams(new FormData(this)) });
                const data = await response.json().catch(() => ({}));
                this.elements['url'].value = '';
                if (data.message) showToast(data.message);
                else showToast('任务添加成功');
                refreshTasks(true);
            } catch (err) {
                showToast(err.message || '创建下载任务失败', 'error');
            } finally {
                button.disabled = false;
            }
        };

        document.getElementById('localMergeForm').onsubmit = async function(e) {
            e.preventDefault();
            const folderInput = document.getElementById('folderInputHidden');
            if (!folderInput.value) {
                showToast('请先选择缓存文件夹', 'warning');
                return;
            }
            const button = this.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                await apiFetch('/local_merge', { method: 'POST', body: new URLSearchParams(new FormData(this)) });
                document.getElementById('folderSelectBtn').textContent = '📁 选择包含.ts缓存的文件夹';
                folderInput.value = '';
                showToast('合并任务添加成功');
                refreshTasks(true);
            } catch (err) {
                showToast(err.message || '创建本地合并任务失败', 'error');
            } finally {
                button.disabled = false;
            }
        };

        function openFolderModal() {
            document.getElementById('folderModal').style.display = 'block';
            const folderList = document.getElementById('folderList');
            folderList.innerHTML = '<div style="text-align:center; padding:20px; color:#9ca3af;">正在加载...</div>';
            apiFetch('/api/folders')
                .then(r => r.json())
                .then(data => {
                    folderList.innerHTML = '';
                    if (!data.folders || data.folders.length === 0) {
                        const empty = document.createElement('div');
                        empty.style.cssText = 'text-align:center; color:#9ca3af; padding:20px;';
                        empty.textContent = '/downloads 目录下没有找到任何文件夹';
                        folderList.appendChild(empty);
                        return;
                    }
                    data.folders.forEach(folder => {
                        const item = document.createElement('div');
                        item.className = 'folder-item';
                        item.textContent = `📁 ${folder}`;
                        item.onclick = () => selectFolder(folder);
                        folderList.appendChild(item);
                    });
                })
                .catch(err => {
                    folderList.innerHTML = '';
                    const error = document.createElement('div');
                    error.style.cssText = 'text-align:center; color:#dc2626; padding:20px;';
                    error.textContent = err.message || '获取文件夹列表失败';
                    folderList.appendChild(error);
                });
        }

        function closeFolderModal() {
            document.getElementById('folderModal').style.display = 'none';
        }

        function selectFolder(folderName) {
            document.getElementById('folderSelectBtn').textContent = `✅ 已选择: ${folderName}`;
            document.getElementById('folderInputHidden').value = folderName;
            closeFolderModal();
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('folderModal')) closeFolderModal();
        }

        function getProgress(log) {
            if (!log) return { percent: 0, text: '' };
            const match = log.match(/(\d+(?:\.\d+)?)%/);
            if (match) {
                return { percent: parseFloat(match[1]), text: log };
            }
            return { percent: 0, text: log };
        }

        function toggleSelectAll() {
            const headerCheckbox = document.getElementById('headerCheckbox');
            const selectAllCheckbox = document.getElementById('selectAll');
            const isChecked = headerCheckbox.checked;
            selectAllCheckbox.checked = isChecked;
            
            document.querySelectorAll('.task-checkbox').forEach(cb => {
                cb.checked = isChecked;
                const taskId = cb.dataset.taskId;
                if (isChecked) {
                    selectedTasks.add(taskId);
                } else {
                    selectedTasks.delete(taskId);
                }
            });
            updateSelectedCount();
        }
        
        function toggleSelectAllFromBatch() {
            const headerCheckbox = document.getElementById('headerCheckbox');
            const selectAllCheckbox = document.getElementById('selectAll');
            const isChecked = selectAllCheckbox.checked;
            headerCheckbox.checked = isChecked;
            
            document.querySelectorAll('.task-checkbox').forEach(cb => {
                cb.checked = isChecked;
                const taskId = cb.dataset.taskId;
                if (isChecked) {
                    selectedTasks.add(taskId);
                } else {
                    selectedTasks.delete(taskId);
                }
            });
            updateSelectedCount();
        }

        function toggleTaskSelect(taskId, checkbox) {
            if (checkbox.checked) {
                selectedTasks.add(taskId);
            } else {
                selectedTasks.delete(taskId);
            }
            updateSelectedCount();
            const total = document.querySelectorAll('.task-checkbox').length;
            const allChecked = total > 0 && total === selectedTasks.size;
            document.getElementById('headerCheckbox').checked = allChecked;
            document.getElementById('selectAll').checked = allChecked;
        }

        function updateSelectedCount() {
            const count = selectedTasks.size;
            document.getElementById('selectedCount').textContent = `已选择 ${count} 个`;
            document.getElementById('batchBar').style.display = count > 0 ? 'flex' : 'none';
        }

        async function batchOperate(action, errorText) {
            if (selectedTasks.size === 0) return;
            const taskIds = Array.from(selectedTasks);
            try {
                await Promise.all(taskIds.map(taskId => apiFetch(`/api/task/${encodeURIComponent(taskId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                })));
            } catch (err) {
                showToast(err.message || errorText, 'error');
            }
            selectedTasks.clear();
            updateSelectedCount();
            refreshTasks(true);
        }

        function batchPause() {
            batchOperate('pause', '批量暂停失败');
        }

        function batchResume() {
            batchOperate('resume', '批量恢复失败');
        }

        function batchCancel() {
            batchOperate('cancel', '批量取消失败');
        }

        function initScrollDetection() {
            const container = document.querySelector('.container');
            const detectScroll = () => {
                isScrolling = true;
                if (scrollTimeout) clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    isScrolling = false;
                }, 150);
            };
            document.addEventListener('touchstart', detectScroll, { passive: true });
            document.addEventListener('touchmove', detectScroll, { passive: true });
            document.addEventListener('touchend', () => {
                if (scrollTimeout) clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    isScrolling = false;
                }, 150);
            }, { passive: true });
            if (container) {
                container.addEventListener('scroll', detectScroll, { passive: true });
            }
        }

        async function refreshTasks(force = false) {
            if (isScrolling || (!force && refreshInFlight) || document.hidden) return;
            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }
            refreshInFlight = true;
            let nextRefreshDelay = IDLE_REFRESH_INTERVAL;
            try {
                const response = await apiFetch('/api/tasks');
                const data = await response.json();
                document.getElementById('workerStatus').innerText = `运行中: ${data.active_workers}/${data.max_workers}`;
                
                const taskIds = Array.isArray(data.task_order) ? data.task_order : Object.keys(data.tasks);
                const hasActiveTask = taskIds.some(id => ['排队中', '下载中', '合并中', '等待FFmpeg', '转换中'].includes(data.tasks[id].status));
                nextRefreshDelay = hasActiveTask ? ACTIVE_REFRESH_INTERVAL : IDLE_REFRESH_INTERVAL;
                selectedTasks.forEach(taskId => {
                    if (!taskIds.includes(taskId)) selectedTasks.delete(taskId);
                });
                
                if (taskIds.length === 0) {
                    requestAnimationFrame(() => {
                        document.getElementById('taskList').innerHTML = 
                            '<tr><td colspan="4" class="empty-state"><div class="empty-icon">📋</div>暂无任务记录</td></tr>';
                        document.getElementById('batchBar').style.display = 'none';
                    });
                    selectedTasks.clear();
                    return;
                }

                let html = '';
                for (let id of taskIds) {
                    let t = data.tasks[id];
                    let progress = getProgress(t.log);
                    const safeId = escapeHtml(id);
                    const safeName = escapeHtml(t.name || '-');
                    const safeStatus = escapeHtml(t.status || '-');
                    const safeLog = escapeHtml(t.log || '-');
                    
                    if (t.status === '下载中' || t.status === '合并中' || t.status === '转换中') {
                        taskProgressCache[id] = progress.percent;
                    } else if (taskProgressCache[id] === undefined) {
                        taskProgressCache[id] = progress.percent;
                    }

                    let displayPercent = taskProgressCache[id];
                    let btns = '';
                    let statusClass = '';
                    displayPercent = Number.isFinite(displayPercent) ? displayPercent : 0;

                    switch(t.status) {
                        case '下载中':
                            btns = `<div class="btn-group"><button class="btn btn-sm btn-warning" data-task-id="${safeId}" onclick="manageTask(this.dataset.taskId,'pause')">暂停</button><button class="btn btn-sm btn-danger" data-task-id="${safeId}" onclick="manageTask(this.dataset.taskId,'cancel')">取消</button></div>`;
                            statusClass = 'status-running';
                            break;
                        case '排队中':
                            btns = `<button class="btn btn-sm btn-danger" data-task-id="${safeId}" onclick="manageTask(this.dataset.taskId,'cancel')">取消</button>`;
                            statusClass = 'status-pending';
                            break;
                        case '等待FFmpeg':
                            btns = `<span style="font-size:11px;color:#6366f1;">等待中...</span>`;
                            statusClass = 'status-waiting';
                            break;
                        case '合并中':
                            btns = `<span style="font-size:11px;color:#7c3aed;">执行中...</span>`;
                            statusClass = 'status-merge';
                            break;
                        case '转换中':
                            btns = `<span style="font-size:11px;color:#7c3aed;">转换中...</span>`;
                            statusClass = 'status-merge';
                            break;
                        case '已完成':
                            displayPercent = 100;
                            statusClass = 'status-done';
                            break;
                        case '完成(强合)':
                            displayPercent = 100;
                            statusClass = 'status-warn';
                            break;
                        case '完成(音频)':
                            displayPercent = 100;
                            statusClass = 'status-done';
                            break;
                        case '已暂停':
                        case '已中断':
                        case '已取消':
                        case '错误':
                            if (t.cmd) {
                                btns = `<div class="btn-group"><button class="btn btn-sm btn-main" data-task-id="${safeId}" onclick="manageTask(this.dataset.taskId,'resume')">恢复</button><button class="btn btn-sm btn-success" data-task-id="${safeId}" onclick="manageTask(this.dataset.taskId,'merge')">强合</button></div>`;
                            } else if (t.audio_target) {
                                btns = `<button class="btn btn-sm btn-main" data-task-id="${safeId}" onclick="manageTask(this.dataset.taskId,'resume')">重新转换</button>`;
                            } else {
                                btns = `<button class="btn btn-sm btn-success" data-task-id="${safeId}" onclick="manageTask(this.dataset.taskId,'merge')">重试合并</button>`;
                            }
                            statusClass = t.status === '已取消' ? 'status-error' : 'status-error';
                            break;
                        default:
                            statusClass = 'status-error';
                    }

                    html += `
                    <tr>
                        <td><input type="checkbox" class="task-checkbox" data-task-id="${safeId}" onchange="toggleTaskSelect(this.dataset.taskId, this)" ${selectedTasks.has(id) ? 'checked' : ''}></td>
                        <td title="${safeName}">${safeName}</td>
                        <td class="status-action-cell"><div class="status-action-wrapper"><span class="status ${statusClass}">${safeStatus}</span>${btns}</div></td>
                        <td>
                            <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(displayPercent, 100)}%"></div></div>
                            <div class="progress-text">${safeLog}</div>
                        </td>
                    </tr>`;
                }
                requestAnimationFrame(() => {
                    document.getElementById('taskList').innerHTML = html;
                    updateSelectedCount();
                });
            } catch (err) {
                document.getElementById('workerStatus').innerText = '连接异常，正在重试';
            } finally {
                refreshInFlight = false;
                scheduleRefresh(nextRefreshDelay);
            }
        }

        function scheduleRefresh(delay) {
            if (document.hidden) return;
            if (refreshTimer) clearTimeout(refreshTimer);
            refreshTimer = setTimeout(refreshTasks, delay);
        }

        function refreshNow() {
            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }
            refreshTasks();
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (refreshTimer) {
                    clearTimeout(refreshTimer);
                    refreshTimer = null;
                }
            } else {
                refreshNow();
            }
        });

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        async function loadVideoFiles() {
            const btn = document.getElementById('scanVideoBtn');
            btn.disabled = true;
            btn.textContent = '🔍 扫描中...';
            try {
                const response = await apiFetch('/api/video_files');
                const data = await response.json();
                videoFilesData = data.videos || [];
                selectedVideoFiles.clear();
                document.getElementById('selectAllVideos').checked = false;

                const container = document.getElementById('videoFileContainer');
                const listDiv = document.getElementById('videoFileList');

                if (videoFilesData.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8; font-size:13px;">未找到任何视频文件</div>';
                    listDiv.style.display = 'block';
                    updateSelectedVideoCount();
                    return;
                }

                container.innerHTML = '';
                videoFilesData.forEach((file, idx) => {
                    const item = document.createElement('div');
                    item.className = 'video-file-item';
                    item.dataset.idx = idx;
                    item.innerHTML = `
                        <input type="checkbox" class="checkbox video-checkbox" data-idx="${idx}" onchange="toggleVideoFileCheckbox(${idx}, this)" onclick="event.stopPropagation()">
                        <div style="flex:1; min-width:0;" onclick="toggleVideoFileByClick(${idx})">
                            <div class="video-file-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
                            ${file.path.includes('/') ? `<div class="video-file-path">${escapeHtml(file.path)}</div>` : ''}
                        </div>
                        <div class="video-file-size" onclick="event.stopPropagation()">${formatFileSize(file.size)}</div>
                    `;
                    item.onclick = function(e) {
                        if (e.target.type !== 'checkbox') toggleVideoFileByClick(idx);
                    };
                    container.appendChild(item);
                });

                listDiv.style.display = 'block';
                updateSelectedVideoCount();
                showToast(`扫描到 ${videoFilesData.length} 个视频文件`, 'info');
            } catch (err) {
                showToast(err.message || '扫描视频文件失败', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '📂 扫描视频文件';
            }
        }

        function toggleVideoFileByClick(idx) {
            const cb = document.querySelector(`.video-checkbox[data-idx="${idx}"]`);
            if (cb) {
                cb.checked = !cb.checked;
                toggleVideoFileCheckbox(idx, cb);
            }
        }

        function toggleVideoFileCheckbox(idx, checkbox) {
            const item = checkbox.closest('.video-file-item');
            if (checkbox.checked) {
                selectedVideoFiles.add(idx);
                if (item) item.classList.add('selected');
            } else {
                selectedVideoFiles.delete(idx);
                if (item) item.classList.remove('selected');
            }
            const total = document.querySelectorAll('.video-checkbox').length;
            const allChecked = total > 0 && total === selectedVideoFiles.size;
            document.getElementById('selectAllVideos').checked = allChecked;
            updateSelectedVideoCount();
        }

        function toggleSelectAllVideos() {
            const isChecked = document.getElementById('selectAllVideos').checked;
            document.querySelectorAll('.video-checkbox').forEach(cb => {
                cb.checked = isChecked;
                const idx = parseInt(cb.dataset.idx);
                const item = cb.closest('.video-file-item');
                if (isChecked) {
                    selectedVideoFiles.add(idx);
                    if (item) item.classList.add('selected');
                } else {
                    selectedVideoFiles.delete(idx);
                    if (item) item.classList.remove('selected');
                }
            });
            updateSelectedVideoCount();
        }

        function updateSelectedVideoCount() {
            const count = selectedVideoFiles.size;
            document.getElementById('selectedVideoCount').textContent = `已选择 ${count} 个`;
            document.getElementById('extractAudioBtn').disabled = count === 0;
        }

        async function batchAudioExtract() {
            if (selectedVideoFiles.size === 0) {
                showToast('请先选择要转换的视频文件', 'warning');
                return;
            }
            const files = Array.from(selectedVideoFiles).map(idx => ({
                path: videoFilesData[idx].path
            }));
            const btn = document.getElementById('extractAudioBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 提交中...';
            try {
                const response = await apiFetch('/api/audio_extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files })
                });
                const data = await response.json().catch(() => ({}));
                showToast(data.message || `已创建 ${files.length} 个转换任务`);
                selectedVideoFiles.clear();
                document.getElementById('selectAllVideos').checked = false;
                document.querySelectorAll('.video-checkbox').forEach(cb => { cb.checked = false; });
                document.querySelectorAll('.video-file-item').forEach(item => item.classList.remove('selected'));
                updateSelectedVideoCount();
                refreshTasks(true);
            } catch (err) {
                showToast(err.message || '创建音频提取任务失败', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🎵 提取选中音频';
            }
        }

        initScrollDetection();
        refreshNow();
    </script>
</body>
</html>
